<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>学多多</title>
    <!-- 依赖已本地化到 ./vendor（React / ReactDOM / KaTeX / 字体），离线在电脑浏览器打开即可，不再依赖外网 CDN -->
    <!-- 安全存储垫片：localStorage/sessionStorage 不可用时降级为内存存储，避免白屏。需在最前执行 -->
    <script src="vendor/storage-shim.js"></script>
    <!-- 加密层（数据加密 + 备份加密）：混淆后的独立文件，需在 app.js 之前加载 -->
    <script src="crypto.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <script src="vendor/katex.min.js"></script>
    <script src="vendor/auto-render.min.js"></script>
    <script src="vendor/react.production.min.js"></script>
    <script src="vendor/react-dom.production.min.js"></script>
    <!-- KaTeX CSS（含 base64 字体）：注入为 <style id="katex-style">，供渲染与导出使用 -->
    <script src="vendor/katex-css.js"></script>
</head>
<body>
    <div id="root"></div>
    <script src="app.js" defer></script>
</body>
</html>
